<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto</title>
    <style>
        table {
            width: 600px;
            margin: 0 auto;
            border-spacing: 5px;
        }

        #btn-tr {
            text-align: center;
        }

        #btn-tr button {
            height: 50px;
            width: 100%;
        }
    </style>
</head>

<body>
    <table>
        <tr id="btn-tr">
            <td colspan="6">
                <button id="btn-select-numbers">당첨 예상 번호 뽑기</button>
            </td>
        </tr>
        <tr id="divider-tr">
            <td colspan="6">
                <hr>
            </td>
        </tr>
    </table>

    <script src="http://code.jquery.com/jquery-4.0.0.js"></script>

    <script>
    function selectWinningNumbers() {

                const numbers = new Array(6);

                for (let i = 0; i < 6; i++) {
                    const number = Math.floor(Math.random() * 45 + 1);
                    numbers[i]= number;
                    for (let j = 0; j < i; j++) {
                        if (numbers[j] == numbers[i]) {
                            i--;
                            break;
                        }
                    }
                }

                return numbers;
            }

        $(function(){
            const table = $('table');
            $('#btn-select-numbers').on('click',function(event){
                const numbers= selectWinningNumbers();
                const tr = $('<tr></tr>');
                numbers.forEach(function(number,idx){
                    $('<td></td>').text(number)
                                  .css({'text-align': 'center','height':'70px','border':'solid 1px black','width':'100px'})
                                  .appendTo(tr);
                });
                table.append(tr);
            });
        });
