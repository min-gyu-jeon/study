<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트</title>
    <style>
        button {
            width: 100px;
            height: 50px;
            border: solid 1px;
            background-color: orange;
        }
    </style>
</head>

<body>
    <script>
        function randomRange(min, max) {
            const gap = max - min;
            const selectedValue = Math.random() * gap + min;
            return selectedValue;
        }
    </script>
    <button onclick="alert('눌러주셔서')">눌러주세요</button>
    <button onclick="alert(randomRange(10,100));">난수를 뽑아주세요.</button>

</body>

</html>
