<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어문 (반복문)</title>
</head>
<body>
    <script>
        let total = 0;

        for (let i = 1; i <= 100; i++) {
            total += i;
        }

        document.write(`<h2>1 ~ 100 합 : ${total}</h2>`);

        total = 0;
        
        for (let i = 100; i > 0; i --) { // i -= 1 == i = i + 1
            total += i;
        }

        document.write(`<h2>1 ~ 100 합 : ${total}</h2>`);
    </script>
</body>
</html>
