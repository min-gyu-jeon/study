<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch 함수 연습</title>
</head>

<body>
    <button id="request-user">유저 데이터 가져오기</button>
    <hr>
    <div id="message"></div>
    <script>
        window.addEventListener('load',function(event){
            const userBtn = document.querySelector('#request-user');
            const div = document.querySelector('#message');

            userBtn.addEventListener('click',function(event){

               fetch('https://jsonplaceholder.typicode.com/users')
                    .then(response => response.json()) 
                    .then(json => {
                        for(let i =0; i < json.length; i++){
                            div.innerHTML += `<h5>${json[i].id}.<a href= 'x.fetch-user-detail.html?id=${json[i].id}'>${json[i].name}</a></h5>`
                        
                        }
                    }); 
            });
        });

    </script>

</body>

</html>
