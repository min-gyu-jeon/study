<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두더지 게임</title>
    <style>
        table {
            margin: 0 auto;
        }

        img,
        #dashboard {
            width: 150px;
            height: 150px;
            border: solid 1px;
        }

        button {
            width: 49%;
            height: 50px;
        }

        #dashboard {
            text-align: center;
            font-size: 15pt;
            font-weight: bold;
        }
    </style>
</head>

<body>
<h3 style="text-align: center;">두더지 게임(wjsalsrb)</h3>
    <table>
        <tr>
            <td><img></td>
            <td><img></td>
            <td><img></td>
            <th id="dashboard" rowspan="4">
                남은시간 : <span id="time">0</span>
                <hr>
                점수 : <span id="score">0</span>
            </th>
        </tr>
        <tr>
            <td><img></td>
            <td><img></td>
            <td><img></td>
        </tr>
        <tr>
            <td><img></td>
            <td><img></td>
            <td><img></td>
        </tr>
        <tr>
            <th colspan="3">
                <button id="btn-start">게임 시작</button>
                <button id="btn-stop">게임 종료</button>
            </th>
        </tr>
    </table>
    <script>
        document.addEventListener("DOMContentLoaded", function (event) {
            const images = document.querySelectorAll("img");
            const timeSpan = document.querySelector("#time");
            const scoreSpan = document.querySelector("#score");

            let score = 0;
            let timeRemain = 0;

            images.forEach((image, idx) => {
                image.src = 'images/hole.jpg';

                image.addEventListener('click', function (event) {
                    if (timerId == null) return;

                    const clickedImage = event.target;
                    if (clickedImage.src.indexOf('mole2.png') >= 0) { //src 속성에 mole2.png문자열의 위치 검사
                        clickedImage.src = 'images/dead.png';

                        score += 100;
                        scoreSpan.innerText = `${score}`;
                    }
                });
            });

            const btnStart = document.querySelector("#btn-start");
            const btnStop = document.querySelector("#btn-stop");

            let timerId = null;
            let timerId2 = null;

            btnStart.addEventListener('click', function (event) {
                if (timerId != null || timerId2 !=null) return;

                score = 0;
                scoreSpan.innerText = `${score}`;
                timerId = setInterval(function () {

                    //두더지 표시
                    //이미지 갯수 범위에서 난수 발생0~9
                    const position = Math.floor(Math.random() * images.length);
                    images[position].src = 'images/mole2.png';

                    //두더지 0.3초뒤에 숨김
                    setTimeout(function () {
                        images[position].src = 'images/hole.jpg';
                    }, 1000);
                }, 2000);

                timeRemain = 30;
                timeSpan.innerText = `${timeRemain}`;

                timerId2 = setInterval(function () {
                    timeRemain -= 1;
                    timeSpan.innerText = `${timeRemain}`;

                    if (timeRemain == 0) {
                        stopGame();
                    }
                }, 1000);

            });

            btnStop.addEventListener('click', function (event) {
                if (timerId == null && timerId2==null) return;

                stopGame();
            });
            function stopGame() {
                clearInterval(timerId);
                timerId = null;
                clearInterval(timerId2);
                timerId2 = null;
            }
        });
    </script>

</body>

</html>
