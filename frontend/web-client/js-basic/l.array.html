<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>

<body>
    <script>
        //1.배열 만들기 및 사용
        let cars = ['람보르기니', '벤틀리', '마이바흐', '테슬라'];
        document.write(`<h3>${cars[0]}</h3>`);
        document.write(`<h3>${cars[3]}</h3>`);

        for (let i = 0; i < cars.length; i++) {
            document.write(`<h3>${cars[i]}</h3>`);
        }
        //2.배열 만들기 및 사용
        let numbers = [];
        for (let i = 0; i < 10; i++) {
            let n = Math.floor(Math.random() * 900) + 100; // 세자리 정수
            numbers.push(n); // 배열.push : 배열의 끝에 데이터 추가
        }
        document.write("<h3>");
        for (let i = 0; i < numbers.length; i++) { // 배열.length : 배열 요소의 갯수            0
            document.write(`${numbers[i]}, `);
        }

        document.write("</h3>");

        //3.
        document.write("<h3>");

        for (let n in numbers) {
            document.write(`${numbers[n]}, `);
        }

        document.write("</h3>");

        //4.
        document.write("<h3>");

        for (let n of numbers) {
            document.write(`${n}, `);
        }

        document.write("</h3>");

        //////////////////////////

        let numbers2 = new Array(10);
        for (let i = 0; i < numbers2.length; i++) {
            numbers2[i] = Math.random() * 100;
        }
        document.write("<h3>");

        for (let n of numbers2) {

            document.write(`${n}, `);

        }
        document.write("</h3>");
    </script>
</body>

</html>
