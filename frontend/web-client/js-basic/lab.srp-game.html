<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가위바위보</title>
    <style>
        td{
            width:100px;
            height: 100px;
            border: solid 2px;
        }
    </style>
</head>

<body>
    <table>
        <tr id ="srcgame">
            <td id="scissors"><img src="images/scissors.png"></td>
            <td id="rock"><img src="images/rock.png"></td>
            <td id="paper"><img src="images/paper.png"></td>
        </tr>
        <tr>
            <td id="start" colspan="3", style="text-align: center;">게임시작</td>
        </tr>
        <tr>
            <td id="selectImg"></td>
            <td id="done" colspan="2"><img src=""></td>
        </tr>
    </table>

    <script>
        document.addEventListener('DOMContentLoaded',function(event){
            const done = document.querySelector('#done');

            const tds =  document.querySelectorAll('#srcgame > td >img');
            for (let i = 0; i<tds.length; i++){
                tds[i].addEventListener('click',function(event){
                    const td = event.target;
                    done.src = td.src;
                });
            }
        })
    </script>

</body>

</html>
