<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무지개색 이벤트 처리기</title>
    <style>
        td {
            width:700px;
            height: 100px;
            border: solid 2px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr id ="colors-tr">
            <td id="btn">무작위 색상</td>
        </tr>
        <tr>
            <td id="canvas" style="width:100%;height: 300px;"></td>
        </tr>
    </table>
    <script>
        const btn = document.querySelector('#btn');
        btn.addEventListener('click', function(event){
            const num1 = Math.random();
            const num2 = Math.random();
            const num3 = Math.random();
            r = Math.floor(num1 * 256);
            g = Math.floor(num2 * 256);
            b = Math.floor(num3 * 256); 
            const canvas = document.querySelector('#canvas');
            canvas.style.backgroundColor = `rgb(${r},${g},${b})`;
        });
    </script>
    
</body>
</html>
