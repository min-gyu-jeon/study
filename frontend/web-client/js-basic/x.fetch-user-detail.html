<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch 함수 연습</title>
</head>

<body>
    <div id="message"></div>
    <script>
        window.addEventListener('load', function (event) {

            const div = document.querySelector('#message');

            // alert(window.location.href);
            // alert(window.location.search);
            // const id = location.search.split('=')[1];

            const qs = new URLSearchParams(window.location.search);
            const id = qs.get('id')

            fetch(`https://jsonplaceholder.typicode.com/users/${id}`)
                .then(function (response) { return response.json(); })
                .then(function(json){
                    div.innerHTML = `<h3>이름:${json.name}</h3>`;
                    div.innerHTML +=`<h5>이메일:${json.email}</h5>`;
                    div.innerHTML +=`<h5>사는곳:${json.address.city}</h5>`;
                    div.innerHTML +=`<h5>전화번호:${json.phone}</h5>`;
                     div.innerHTML +=`<h5>회사 이름:${json.company.name}</h5>`;
                })

        });
    </script>

</body>

</html>
